server {
    listen 80 default;
    server_name localhost _;
    server_tokens off;

    # Crawlers need an absolute og:image URL. Rewrite the static relative path
    # using the request host so previews work on every deployed environment.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'content="/og-image.png"' 'content="https://$host/og-image.png"';

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Redirect all requests to index.html
        try_files $uri /index.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
